name = "sdg-journey-api"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

# Slows down password guessing and sign-up spam on /auth routes:
# 10 attempts per minute per email (login, forgot password), per reset token,
# or per IP (sign-up). Counts are approximate and per Cloudflare location.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Secrets are set with `wrangler secret put <NAME>` (never committed):
#   DATABASE_URL, JWT_SECRET, RESEND_API_KEY, EMAIL_FROM,
#   S3_ENDPOINT, S3_BUCKET, S3_REGION, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
#   ANTHROPIC_API_KEY
# For `wrangler dev`, put them in server/.dev.vars instead.
